name: Build

# Pushes to main are handled by release.yml, which verifies, versions and
# publishes. This workflow keeps pull requests honest without releasing.
on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck and smoke test
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8
        ports: ['27099:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Electron refuses to start unless its SUID sandbox helper is owned by
      # root, which npm cannot do when it unpacks the binary.
      - name: Grant Electron's sandbox helper its permissions
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      # Electron also needs a virtual display on a headless runner.
      - name: Smoke test
        run: xvfb-run --auto-servernum npm run smoke

  package:
    name: Package ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installers
        run: npm run build && npx electron-builder --publish never
        env:
          # electron-builder would otherwise try to sign macOS builds.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
          if-no-files-found: warn
